<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Self-practice — English Quiz</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="page">
  <nav class="top-nav">
    <a class="brand" href="index.html">English Quiz<span class="sub">with Kris</span></a>
  </nav>

  <a class="btn btn-outline" href="index.html" style="display:inline-block;margin-bottom:24px;text-decoration:none">← Back to home</a>

  <!-- Intro -->
  <div id="intro-view" class="panel">
    <h2>Self-practice</h2>
    <p>Go through a quiz on your own. You'll see the right answer right after each question.</p>

    <h3 style="margin-top:24px">Have a code from your lesson?</h3>
    <div class="field">
      <label for="code-input">Room code</label>
      <input id="code-input" type="text" maxlength="4" placeholder="ABCD" style="text-transform:uppercase" />
    </div>
    <div class="error-text" id="code-error" style="display:none"></div>
    <button id="code-start-btn" class="btn">Practice with this code</button>

    <h3 style="margin-top:32px">Or pick a public practice quiz</h3>
    <div class="field">
      <label for="quiz-select">Choose a quiz</label>
      <select id="quiz-select"></select>
    </div>
    <button id="start-btn" class="btn btn-outline">Start</button>
  </div>

  <!-- Quiz -->
  <div id="quiz-view" class="panel" style="display:none">
    <div class="header-chips">
      <div class="header-chip chip-navy"><span class="label">Progress</span><span class="value" id="progress">-</span></div>
      <div class="header-chip chip-amber"><span class="label">Score</span><span class="value" id="running-score">0</span></div>
    </div>
    <div id="question-container"></div>
    <button id="next-btn" class="btn" style="display:none;margin-top:16px">Next</button>
  </div>

  <!-- Done -->
  <div id="done-view" class="panel" style="display:none">
    <h2>Nice work!</h2>
    <p>Final score: <strong id="final-score">0</strong></p>
    <button id="retry-btn" class="btn">Practice again</button>
  </div>
</div>

<script type="module" src="js/practice.js"></script>
</body>
</html>
