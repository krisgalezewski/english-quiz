<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Join a quiz — English Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="page">
  <nav class="top-nav">
    <a class="brand" href="index.html">English Quiz<span class="sub">with Kris</span></a>
  </nav>

  <a class="btn btn-outline" href="index.html" style="display:inline-block;margin-bottom:24px;text-decoration:none">← Back to home</a>

  <!-- Join -->
  <div id="join-view" class="panel">
    <h2>Join a quiz</h2>
    <div class="field">
      <label for="code-input">Room code</label>
      <input id="code-input" type="text" maxlength="4" placeholder="ABCD" style="text-transform:uppercase" />
    </div>
    <div class="field">
      <label for="name-input">Your name</label>
      <input id="name-input" type="text" placeholder="Your name" />
    </div>
    <div class="field">
      <label>Pick an avatar</label>
      <div id="avatar-picker" class="scramble-tiles"></div>
    </div>
    <div class="error-text" id="join-error" style="display:none"></div>
    <button id="join-btn" class="btn">Join</button>
  </div>

  <!-- Waiting room -->
  <div id="waiting-view" class="panel" style="display:none">
    <h2>Waiting for the host to start…</h2>
    <p>Other players so far:</p>
    <div id="other-players" class="player-list"></div>
  </div>

  <!-- Live question -->
  <div id="question-view" class="panel" style="display:none">
    <div class="question-header">
      <span class="timer" id="timer">--</span>
      <span class="muted" id="question-progress"></span>
      <span class="muted">My score: <span id="my-score">0</span></span>
    </div>
    <div id="question-container"></div>
  </div>

  <!-- Finished -->
  <div id="finished-view" class="panel" style="display:none">
    <h2>Quiz finished!</h2>
    <p>Your score: <strong id="final-score">0</strong></p>
    <p>Rank: <span id="final-rank"></span></p>
    <a class="btn" href="practice.html" style="display:inline-block;margin-top:12px;text-decoration:none">Practice this quiz solo</a>
  </div>
</div>

<script type="module" src="js/play.js"></script>
</body>
</html>
