<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Join a quiz — English Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.js"></script>
</head>
<body>
<div class="page">
  <nav class="top-nav">
    <a class="brand" href="index.html">English Quiz<span class="sub">with Kris</span></a>
  </nav>

  <a class="btn btn-outline" href="index.html" style="display:inline-block;margin-bottom:24px;text-decoration:none">← Back to home</a>

  <!-- Join -->
  <div id="join-view" class="panel">
    <h2>Join a quiz</h2>
    <div class="field">
      <label for="code-input">Room code</label>
      <input id="code-input" type="text" maxlength="4" placeholder="ABCD" style="text-transform:uppercase" />
    </div>
    <div class="field">
      <label for="name-input">Your name</label>
      <input id="name-input" type="text" placeholder="Your name" />
    </div>
    <div class="field">
      <label>Pick an avatar</label>
      <div id="avatar-picker" class="scramble-tiles"></div>
      <details style="margin-top:8px">
        <summary style="cursor:pointer;color:var(--cream-faint);font-size:13px">More avatars…</summary>
        <div id="avatar-picker-more" class="scramble-tiles" style="margin-top:10px"></div>
      </details>
    </div>
    <div class="error-text" id="join-error" style="display:none"></div>
    <button id="join-btn" class="btn">Join</button>

    <details style="margin-top:20px">
      <summary style="cursor:pointer;color:var(--cream-faint);font-size:13px">Got disconnected? Reconnect with your return code</summary>
      <div style="margin-top:12px">
        <div class="field">
          <label for="reconnect-input">Return code (ask your teacher)</label>
          <input id="reconnect-input" type="text" maxlength="4" placeholder="ABCD" style="text-transform:uppercase" />
        </div>
        <div class="error-text" id="reconnect-error" style="display:none"></div>
        <button id="reconnect-btn" class="btn btn-outline">Reconnect</button>
      </div>
    </details>
  </div>

  <!-- Waiting room -->
  <div id="waiting-view" class="panel" style="display:none">
    <h2>Waiting for the host to start…</h2>
    <p>Other players so far:</p>
    <div id="other-players" class="player-list"></div>
  </div>

  <!-- Live question -->
  <div id="question-view" class="panel" style="display:none">
    <div class="header-chips">
      <div class="header-chip chip-navy"><span class="label">Time left</span><span class="value" id="timer">--</span></div>
      <div class="header-chip chip-teal"><span class="label">Progress</span><span class="value" id="question-progress">-</span></div>
      <div class="header-chip chip-amber"><span class="label">My score</span><span class="value" id="my-score">0</span></div>
    </div>
    <div id="players-roster" class="player-list" style="margin-bottom:20px"></div>
    <div id="question-container"></div>
  </div>

  <!-- Finished -->
  <div id="finished-view" class="panel" style="display:none">
    <div class="winner-banner" id="finished-banner">
      <span class="trophy" id="finished-trophy">🎉</span>
      <h2 id="finished-headline">Quiz finished!</h2>
      <p style="color:rgba(241,236,223,0.85);margin:0">Your score: <strong id="final-score">0</strong> · Rank: <span id="final-rank"></span></p>
    </div>
    <p id="finished-message" class="muted" style="font-size:16px;color:var(--cream-dim);text-align:center"></p>
    <a id="practice-link" class="btn" href="practice.html" style="display:inline-block;margin-top:12px;text-decoration:none">Practice this quiz solo</a>
  </div>
</div>

<script type="module" src="js/play.js"></script>
</body>
</html>
